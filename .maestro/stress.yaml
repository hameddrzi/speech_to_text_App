# Stress: 10 quick record/stop cycles, 30 rapid tab switches, every sheet opened and closed
# 5 times, then the smoke checks to prove the app is still responsive.
# (The app is locked to portrait, so rotation is not exercised.) About 5-8 minutes.
appId: com.voicetranscript.app
name: stress
tags:
  - stress
  - slow
---
- runFlow: subflows/launch-clean.yaml

# ── 10 × record ~2 s and save ──
- repeat:
    times: 10
    commands:
      - runFlow:
          file: subflows/record-take.yaml
          env:
            TIMER_REGEX: '00:0[2-9],[0-9]{2}|Elapsed [2-9] seconds'
      - assertVisible:
          id: "record-status"
          text: "Ready to record"
- takeScreenshot: stress_01_after_10_takes

# All ten were saved, newest first ("New Recording", "New Recording 2" … "New Recording 10").
- tapOn:
    id: "tab-archive"
- extendedWaitUntil:
    visible: "New Recording 10.*"
    timeout: 10000
- takeScreenshot: stress_02_archive_10_rows

# ── 30 rapid tab switches ──
- repeat:
    times: 10
    commands:
      - tapOn:
          id: "tab-record"
      - tapOn:
          id: "tab-archive"
      - tapOn:
          id: "tab-profile"
- takeScreenshot: stress_03_after_tab_switching

# ── Every sheet × 5 ──
- repeat:
    times: 5
    commands:
      # Profile: name sheet
      - tapOn:
          id: "tab-profile"
      - scrollUntilVisible:
          element:
            id: "profile-name-edit"
          direction: UP
      - tapOn:
          id: "profile-name-edit"
      - extendedWaitUntil:
          visible:
            id: "name-sheet-cancel"
          timeout: 5000
      - tapOn:
          id: "name-sheet-cancel"
      - extendedWaitUntil:
          notVisible:
            id: "name-sheet-input"
          timeout: 5000
      # Profile: speech model sheet
      - tapOn:
          id: "speech-model-row"
      - extendedWaitUntil:
          visible:
            id: "model-sheet-done"
          timeout: 5000
      - tapOn:
          id: "model-sheet-done"
      - extendedWaitUntil:
          notVisible:
            id: "model-sheet"
          timeout: 5000
      # Profile: delete-recordings sheet
      - scrollUntilVisible:
          element:
            id: "delete-recordings-row"
          direction: DOWN
      - tapOn:
          id: "delete-recordings-row"
      - extendedWaitUntil:
          visible:
            id: "auto-delete-sheet-done"
          timeout: 5000
      - tapOn:
          id: "auto-delete-sheet-done"
      - extendedWaitUntil:
          notVisible:
            id: "auto-delete-sheet"
          timeout: 5000
      # Detail: export sheet
      - tapOn:
          id: "tab-archive"
      - tapOn:
          id: "recording-row-.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "detail-export"
          timeout: 5000
      - tapOn:
          id: "detail-export"
      - extendedWaitUntil:
          visible:
            id: "export-done"
          timeout: 5000
      - tapOn:
          id: "export-done"
      - extendedWaitUntil:
          notVisible:
            id: "export-sheet"
          timeout: 5000
      - tapOn:
          id: "detail-back"
      - extendedWaitUntil:
          visible:
            id: "archive-search"
          timeout: 5000
- takeScreenshot: stress_04_after_sheets

# ── Still responsive (smoke checks) ──
- tapOn:
    id: "tab-record"
- assertVisible:
    id: "record-button"
- assertVisible:
    id: "record-status"
    text: "Ready to record"
- runFlow:
    file: subflows/record-take.yaml
    env:
      TIMER_REGEX: '00:0[2-9],[0-9]{2}|Elapsed [2-9] seconds'
- tapOn:
    id: "tab-archive"
- extendedWaitUntil:
    visible: "New Recording 11.*"
    timeout: 10000
- tapOn:
    id: "tab-profile"
- assertVisible:
    id: "speech-model-row"
- takeScreenshot: stress_05_final
