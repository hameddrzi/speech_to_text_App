<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Voice app icon: master artwork. "Voice becomes text": a red recording waveform that decays
    into three near-black transcript lines.

    This file is the single source of truth. `node scripts/export-icons.js` splits it into the
    layer SVGs (by the ids of the top-level <g> elements below) and renders every PNG size.
    Keep each layer a flat top-level <g id="..."> without nested groups, and use filled shapes
    (no strokes) so Icon Composer and Android vector tooling read them reliably.
  -->
  <defs>
    <radialGradient id="peach" cx="230" cy="250" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD6D3"/>
      <stop offset="1" stop-color="#FFD6D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky" cx="830" cy="830" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6E8FF"/>
      <stop offset="1" stop-color="#D6E8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavender" cx="880" cy="150" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDE3FF"/>
      <stop offset="1" stop-color="#EDE3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: near-white canvas with the app's three ambient pastel blobs. -->
  <g id="background">
    <rect width="1024" height="1024" fill="#FBFBFD"/>
    <rect width="1024" height="1024" fill="url(#lavender)"/>
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <rect width="1024" height="1024" fill="url(#peach)"/>
  </g>

  <!-- Waveform: four bars in the recording red, the last one fading out. -->
  <g id="wave" fill="#FF3B30">
    <rect x="216" y="412" width="60" height="200" rx="30"/>
    <rect x="306" y="302" width="60" height="420" rx="30"/>
    <rect x="396" y="362" width="60" height="300" rx="30"/>
    <rect x="486" y="427" width="60" height="170" rx="30"/>
  </g>

  <!-- Transcript: three lines of "text" in the label color, ragged like a paragraph. -->
  <g id="lines" fill="#0B0B0F">
    <rect x="576" y="387" width="232" height="60" rx="30"/>
    <rect x="576" y="482" width="202" height="60" rx="30"/>
    <rect x="576" y="577" width="144" height="60" rx="30"/>
  </g>
</svg>
